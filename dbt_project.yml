name: 'civica_proyecto_pvg'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  civica_proyecto_pvg:
    staging:
      +materialized: view
      raw_videojuegos:
        +schema: raw_videojuegos
    silver:
      +materialized: table
      videojuegos:
        +schema: silver_videojuegos
    gold:
      +database: gold_db
      intermediate:
        +materialized: ephemeral
        +schema: intermediate
      core:
        +materialized: table
        +schema: core